<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing</title>
<!-- Both from the shell's origin: the OS look and the OS bridge, no vendoring. -->
<link rel="stylesheet" href="http://localhost:4100/design/tokens.css">
<script src="http://localhost:4100/sdk/headunit.js"></script>
<style>
  /* `safe` centring so that if the content ever does exceed the screen it
     overflows downward and stays reachable, instead of being clipped at both
     ends the way plain centring clips it. */
  body {
    display: grid; place-content: safe center; justify-items: center;
    padding: var(--gap-6); overflow-y: auto;
  }

  .np {
    display: grid; grid-template-columns: auto 1fr; align-items: center;
    gap: var(--gap-7); width: 100%; max-width: 1180px;
  }

  /* ── Artwork ─────────────────────────────────────────────────
     Bluetooth almost never sends a sleeve, so the fallback is not an error
     state — it is what this screen looks like most of the time, and it has to
     look chosen. The hue comes from the track itself, so a given song always
     gets the same colour. */
  .art {
    position: relative; overflow: hidden;
    height: min(clamp(150px, 32vw, 400px), 56vh); width: auto; aspect-ratio: 1;
    border-radius: var(--radius-lg);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--shadow);
    background: linear-gradient(152deg,
      hsl(var(--art-hue, 190) 55% 38%), hsl(calc(var(--art-hue, 190) + 46) 48% 16%));
    background-size: cover; background-position: center;
    display: grid; place-items: center;
  }
  :root[data-theme="day"] .art {
    background: linear-gradient(152deg,
      hsl(var(--art-hue, 190) 58% 60%), hsl(calc(var(--art-hue, 190) + 46) 46% 38%));
    background-size: cover; background-position: center;
  }
  .art::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(158deg, rgba(255, 255, 255, 0.14), transparent 52%);
  }
  .art-note { font-size: clamp(72px, 11vw, 132px); color: rgba(255, 255, 255, 0.34); line-height: 1; }
  .art[data-art="image"] { background-image: var(--art-image); }
  .art[data-art="image"] .art-note { display: none; }

  /* ── Track ───────────────────────────────────────────────── */
  .meta { min-width: 0; }
  .eyebrow {
    margin: 0 0 var(--gap-3); font-size: var(--text-xs); color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.22em;
  }
  .title {
    margin: 0; font-size: var(--text-3xl); font-weight: 700; line-height: 1.04;
    letter-spacing: -0.02em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .artist { margin: var(--gap-3) 0 0; font-size: var(--text-xl); color: var(--ink-dim); }
  .album {
    margin: var(--gap-1) 0 0; font-size: var(--text-sm); color: var(--ink-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .artist:empty, .album:empty { display: none; }

  /* ── Progress ────────────────────────────────────────────── */
  .progress { margin-top: var(--gap-6); }
  .rail {
    height: 6px; border-radius: 3px; overflow: hidden;
    background: color-mix(in srgb, var(--ink) 14%, transparent);
  }
  .fill {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, transparent), var(--accent));
    box-shadow: 0 0 16px var(--bloom);
  }
  .times {
    display: flex; justify-content: space-between; margin-top: var(--gap-2);
    font-family: var(--font-mono); font-size: var(--text-sm);
    font-variant-numeric: tabular-nums; color: var(--ink-dim);
  }

  /* ── Transport ───────────────────────────────────────────── */
  .transport { display: flex; align-items: center; gap: var(--gap-5); margin-top: var(--gap-6); }
  .transport button {
    min-height: var(--touch-lg); height: var(--touch-lg); width: var(--touch-lg);
    padding: 0; display: grid; place-items: center;
    border-radius: var(--radius-pill);
    background: var(--surface); border-color: var(--glass-edge);
    font-size: var(--text-xl); line-height: 1;
  }
  .transport button:hover { border-color: var(--accent); box-shadow: 0 0 26px -8px var(--bloom); }
  /* A control the phone will not honour is shown and dimmed rather than moved
     or removed: the row must not reflow every time a track changes. */
  .transport button[disabled] { opacity: 0.3; pointer-events: none; }
  .transport .play {
    height: 88px; width: 88px; font-size: var(--text-2xl);
    background: var(--accent); color: var(--accent-ink); border-color: transparent;
  }

  .source {
    margin: var(--gap-6) 0 0; font-size: var(--text-xs); color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.14em;
  }
  .source[data-tone="demo"] { color: var(--warn); }

  /* ── Nothing playing ─────────────────────────────────────── */
  .idle { text-align: center; max-width: 560px; }
  .idle-note { font-size: clamp(64px, 9vw, 104px); color: var(--ink-faint); line-height: 1; }
  .idle h1 { margin: var(--gap-5) 0 var(--gap-2); font-size: var(--text-2xl); }
  .idle p { margin: 0; color: var(--ink-dim); font-size: var(--text); line-height: 1.5; }

  /* Stack only when the screen is genuinely narrow or portrait. A short, wide
     dashboard screen (800x480 is a common one) keeps the two columns — it has
     the width, and stacking there is what pushed the transport off-screen. */
  @media (max-width: 700px), (orientation: portrait) {
    .np { grid-template-columns: 1fr; gap: var(--gap-4); justify-items: center; text-align: center; }
    .meta { width: 100%; }
    .transport { justify-content: center; }
  }

  /* Short screens: give the vertical budget back to the controls. */
  @media (max-height: 620px) {
    body { padding: var(--gap-4); }
    .np { gap: var(--gap-5); }
    .title { font-size: var(--text-2xl); }
    .artist { font-size: var(--text-lg); }
    .progress, .transport, .source { margin-top: var(--gap-4); }
    .transport { gap: var(--gap-4); }
    .transport button { min-height: var(--touch); height: var(--touch); width: var(--touch); }
    .transport .play { height: 72px; width: 72px; font-size: var(--text-xl); }
  }
</style>
</head>
<body>

<main class="np" id="np" hidden>
  <div class="art" id="art"><span class="art-note">&#9835;</span></div>

  <div class="meta">
    <p class="eyebrow" id="eyebrow">Now playing</p>
    <h1 class="title" id="title">&nbsp;</h1>
    <p class="artist" id="artist"></p>
    <p class="album" id="album"></p>

    <div class="progress" id="progress">
      <div class="rail"><span class="fill" id="fill"></span></div>
      <div class="times"><span id="elapsed">0:00</span><span id="remaining">0:00</span></div>
    </div>

    <div class="transport">
      <button id="prev" aria-label="Previous track">&#9198;</button>
      <button id="play" class="play" aria-label="Play or pause">&#9199;</button>
      <button id="next" aria-label="Next track">&#9197;</button>
    </div>

    <p class="source" id="source"></p>
  </div>
</main>

<section class="idle" id="idle">
  <div class="idle-note">&#9835;</div>
  <h1 id="idleTitle">Nothing playing</h1>
  <p id="idleWhy">Start something on your phone and it will show up here.</p>
</section>

<script>
  const $ = (id) => document.getElementById(id);
  let media = headunit.media;

  const PLAY = '▶';
  const PAUSE = '⏸';

  const playing = () => media.state === 'playing' || media.state === 'changing';
  const hasTrack = () => ['playing', 'paused', 'changing'].includes(media.state);

  const clock = (ms) => {
    const total = Math.max(0, Math.round(ms / 1000));
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
  };

  /* One song, one colour, every time — the sleeve stand-in should feel like a
     property of the track rather than something random per screen. */
  function hueFor(key) {
    let hash = 0;
    for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
    return hash % 360;
  }

  /* The source reports a position every couple of seconds; the bar moves in
     between by advancing from the moment that reading was taken. */
  function position() {
    if (media.position == null) return null;
    const drift = playing() && media.positionAt ? Date.now() - media.positionAt : 0;
    return Math.min(media.duration ?? Infinity, media.position + drift);
  }

  function paintProgress() {
    const at = position();
    // Bluetooth often reports no duration at all. A bar that cannot move is
    // worse than no bar, so it goes away rather than sitting at zero.
    const known = Boolean(media.duration) && at !== null;
    $('progress').style.visibility = known ? 'visible' : 'hidden';
    if (!known) return;
    $('fill').style.width = `${((at / media.duration) * 100).toFixed(2)}%`;
    $('elapsed').textContent = clock(at);
    $('remaining').textContent = `-${clock(media.duration - at)}`;
  }

  const SOURCES = {
    demo: ['Demo source — not your phone', 'demo'],
    'windows-media': ['Bluetooth · Windows media session', 'live'],
  };

  function render() {
    const showing = hasTrack();
    $('np').hidden = !showing;
    $('idle').hidden = showing;

    if (!showing) {
      const connected = media.source !== 'unavailable';
      $('idleTitle').textContent = connected ? 'Nothing playing' : 'No media source';
      $('idleWhy').textContent = connected
        ? 'Start something on your phone and it will show up here.'
        : 'Pair your iPhone over Bluetooth and play something. The head unit reads the track from the phone; it does not play it.';
      return;
    }

    $('title').textContent = media.title || 'Unknown track';
    $('artist').textContent = media.artist || '';
    $('album').textContent = media.album || '';

    const art = $('art');
    art.style.setProperty('--art-hue', hueFor(media.trackKey || media.title || ''));
    art.dataset.art = media.artUrl ? 'image' : 'none';
    art.style.setProperty('--art-image', media.artUrl ? `url("${media.artUrl}")` : 'none');

    $('play').textContent = playing() ? PAUSE : PLAY;
    $('play').setAttribute('aria-label', playing() ? 'Pause' : 'Play');
    $('play').disabled = !(media.canPlay || media.canPause);
    $('prev').disabled = !media.canPrevious;
    $('next').disabled = !media.canNext;

    const [label, tone] = SOURCES[media.source] || ['No media source', 'none'];
    $('source').textContent = label;
    $('source').dataset.tone = tone;
    $('eyebrow').textContent = playing() ? 'Now playing' : 'Paused';

    paintProgress();
  }

  $('play').onclick = () => headunit.mediaCommand('playpause');
  $('prev').onclick = () => headunit.mediaCommand('previous');
  $('next').onclick = () => headunit.mediaCommand('next');

  headunit.ready((hu) => { media = hu.media; render(); });
  headunit.on('media', (next) => { media = next; render(); });

  /* Only the playhead is animated; everything else repaints on an event. */
  (function frame() {
    if (hasTrack()) paintProgress();
    requestAnimationFrame(frame);
  })();

  render();
</script>
</body>
</html>
