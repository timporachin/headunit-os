<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Head Unit</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/shell.css">
</head>
<body>

<div id="shell" class="shell" data-view="launcher">

  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="horizon"></span>
    <span class="vignette"></span>
  </div>


  <!-- Chrome the shell owns. An app never draws these, so they stay correct
       even while an app is booting, wedged, or repainting. -->
  <header class="statusbar">
    <button id="homeBtn" class="status-home" title="Home" aria-label="Home">
      <span class="glyph">⌂</span>
    </button>
    <div class="status-title">
      <span id="statusTitle">Home</span>
      <span id="statusState" class="status-state" hidden></span>
    </div>
    <!-- Music is the one thing still running while you are looking at something
         else, so its controls live in the chrome rather than only in its app. -->
    <div class="status-media" id="statusMedia" hidden>
      <button id="statusMediaOpen" class="status-media-open" aria-label="Open Now Playing">
        <span class="status-media-art" id="statusMediaArt" aria-hidden="true">&#9835;</span>
        <span class="status-media-text">
          <span class="status-media-title" id="statusMediaTitle"></span>
          <span class="status-media-artist" id="statusMediaArtist"></span>
        </span>
      </button>
      <button id="statusMediaToggle" class="status-chip" aria-label="Play or pause">
        <span id="statusMediaGlyph">&#9199;</span>
      </button>
    </div>

    <div class="status-right">
      <button id="themeBtn" class="status-chip" aria-label="Toggle day and night">
        <span id="themeGlyph">☾</span>
      </button>
      <time id="clock" class="status-clock">--:--</time>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Installed apps">
    <div class="rail-apps" id="railApps"></div>
  </nav>

  <!-- An immersive app hides the rail; this tab brings it back without
       stealing space from a map or a camera view. -->
  <button id="railTab" class="rail-tab" hidden aria-label="Show navigation">›</button>

  <main class="stage" id="stage">

    <section class="launcher" id="launcher">

      <!-- The glance half. A head unit home screen is looked at far more often
           than it is used, so the thing it shows at rest has to be worth the
           space: time first, at a size readable from the driver's seat. -->
      <div class="hero">
        <div class="hero-now">
          <p class="hero-greet" id="heroGreet">Hello</p>
          <time class="hero-clock" id="heroClock">
            <span class="hero-time" id="heroTime">--:--</span>
            <span class="hero-tail">
              <span class="hero-meridiem" id="heroMeridiem"></span>
              <span class="hero-seconds" id="heroSeconds">00</span>
            </span>
          </time>
          <div class="hero-rail" aria-hidden="true"><span class="hero-rail-fill" id="heroRail"></span></div>
          <p class="hero-date" id="heroDate">&nbsp;</p>
        </div>
        <!-- Collapses entirely when nothing is playing, so the home screen at
             rest looks exactly as it did before there was a media source. -->
        <button class="hero-media" id="heroMedia" hidden>
          <span class="hero-media-art" id="heroMediaArt" aria-hidden="true">&#9835;</span>
          <span class="hero-media-text">
            <span class="hero-media-label" id="heroMediaLabel">Now playing</span>
            <span class="hero-media-title" id="heroMediaTitle"></span>
            <span class="hero-media-artist" id="heroMediaArtist"></span>
            <span class="hero-media-rail" id="heroMediaRail" aria-hidden="true">
              <span class="hero-media-fill" id="heroMediaFill"></span>
            </span>
          </span>
        </button>

        <dl class="hero-stats">
          <div><dt>Installed</dt><dd id="statApps">&mdash;</dd></div>
          <div><dt>Running</dt><dd id="statRunning">&mdash;</dd></div>
          <div><dt>Vehicle</dt><dd id="statVehicle">no signal</dd></div>
        </dl>
      </div>

      <div class="apps">
        <div class="apps-head">
          <h2>Apps</h2>
          <span id="launcherSub"></span>
        </div>
        <div class="grid" id="appGrid"></div>
        <p class="launcher-empty" id="launcherEmpty" hidden>
          No apps installed yet. Add one at <code>apps/&lt;id&gt;/app.json</code>.
        </p>
        <div class="registry-errors" id="registryErrors" hidden></div>
      </div>

    </section>

    <!-- One frame per opened app, kept alive in the background so returning to
         an app does not pay its boot cost twice. -->
    <section class="frames" id="frames" hidden></section>

    <section class="boot" id="boot" hidden>
      <div class="boot-inner">
        <div class="spinner" aria-hidden="true"></div>
        <h2 id="bootName">Starting</h2>
        <p id="bootNote">Bringing the app up…</p>
      </div>
    </section>

    <section class="failure" id="failure" hidden>
      <div class="failure-inner">
        <h2 id="failName">Could not start</h2>
        <p id="failWhy" class="failure-why"></p>
        <pre id="failLog" class="failure-log" aria-label="App output"></pre>
        <div class="failure-actions">
          <button id="retryBtn" class="primary">Try again</button>
          <button id="failHomeBtn">Back to home</button>
        </div>
      </div>
    </section>

  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>

<script src="/shell.js"></script>
</body>
</html>
